name: '@konker.dev/application-boilerplate.konker.dev / CD / Development [Kubernetes]'

on:
  workflow_dispatch:

#  push:
#    branches:
#      - 'development'
#    paths:
#      - 'apps/application-boilerplate.konker.dev/backend/src/**'
#      - 'apps/application-boilerplate.konker.dev/backend/deployment/kubernetes/**'
#      - 'apps/application-boilerplate.konker.dev/zerosync/src/**'

env:
  CWD: './apps/application-boilerplate.konker.dev/backend'
  AWS_DEFAULT_REGION: 'eu-west-1'
  AWS_ECR_REGISTRY: '047719649582.dkr.ecr.eu-west-1.amazonaws.com'
  AWS_ECR_REPOSITORY: 'application-boilerplate.konker.dev'
  IMAGE_TAG: '${{ github.sha }}'
  K8S_NAMESPACE: 'application-boilerplate'
  CFKE_CLUSTER_ID: '2c29f203-bbf2-4a4b-89ed-d0c62a1285f2'
  CFKE_REGION: 'europe-central-1a'
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_EXTRA_ARGS: '${{ inputs.extra_args }}'

jobs:
  cd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: CD Development
    environment: development
    permissions:
      id-token: write # AWS OIDC (ECR) + GitHub OIDC (CloudFleet)
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '9.6.0'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Authenticate via GitHub OIDC -> CI role (same account as ECR; KDV-233)
      - name: Configure AWS credentials (CI OIDC role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "arn:aws:iam::047719649582:role/infra/ci-application-boilerplate-konker-dev"
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Build and push backend container to ECR (Development)
        run: |
          cd ${{ env.CWD }}
          # Build the backend's entire workspace dependency graph (zerosync,
          # middleware-fp and its transitive workspace deps) so each package's
          # dist/ exists before build:prod packages the backend via
          # `pnpm deploy --prod`. `^...` selects dependencies only, not the
          # backend itself (build-container builds that via tsup).
          pnpm --filter "@konker.dev/application-boilerplate.konker.dev^..." run build
          pnpm run build-container
          # Push only the immutable, unique :$IMAGE_TAG (= git sha). The ECR repo
          # is IMMUTABLE, so :latest cannot be overwritten — deploys reference the
          # sha tag directly (set via kustomize at apply time below).
          pnpm run push-container
          cd -

      # CloudFleet (cfke) kubectl access via GitHub OIDC workload-identity
      # federation. Requires repo vars CFKE_CLUSTER_ID / CFKE_REGION and a
      # federation trust configured on the CloudFleet side for this repo.
      - name: Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: Setup kustomize
        run: |
          KUSTOMIZE_VERSION=5.5.0
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar -xz
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Configure kubectl (CloudFleet OIDC)
        uses: cloudfleet-actions/configure-kubectl@v1
        with:
          cluster-id: ${{ env.CFKE_CLUSTER_ID }}
          region: ${{ env.CFKE_REGION }}

      # Chain into the development account's application-deployment-role to read
      # the DB superuser secret from SSM (the /secrets/development/* params live
      # in account 898403669204, not the deployment account). Mirrors the
      # serverless CD. kubectl context is unaffected (cloudfleet kubeconfig is
      # independent of AWS creds).
      - name: Configure AWS credentials (application-deployment-role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "arn:aws:iam::898403669204:role/infra/application-deployment-role"
          role-external-id: "application-deployment-access"
          role-chaining: true
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      # Apply DB migrations before the rollout: they create the `widgets` table
      # and the `application_boilerplate_zero_data` publication that zero-sync's
      # db-check initContainer gates on. The private RDS is reached by
      # port-forwarding the in-cluster ssh-tunnel-proxy (bastion -> RDS), then
      # drizzle-kit connects on localhost. Must run as the DB superuser (CREATE
      # DDL + publication; the app user cannot). Idempotent (drizzle tracks
      # applied migrations).
      - name: Run database migrations (Development)
        run: |
          set -euo pipefail

          CONN="$(aws ssm get-parameter \
            --name /secrets/development/application-boilerplate/database/superuser/connection-info \
            --with-decryption --query Parameter.Value --output text)"
          DB_USER="$(echo "$CONN" | jq -r '.username')"
          DB_PASSWORD="$(echo "$CONN" | jq -r '.password')"
          DB_NAME="$(echo "$CONN" | jq -r '.dbname')"
          echo "::add-mask::$DB_PASSWORD"

          kubectl port-forward -n infrastructure-development svc/ssh-tunnel-proxy 54321:54321 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/54321) 2>/dev/null; do sleep 1; done'

          cd ${{ env.CWD }}
          DATABASE_HOST=127.0.0.1 \
          DATABASE_PORT=54321 \
          DATABASE_USER="$DB_USER" \
          DATABASE_PASSWORD="$DB_PASSWORD" \
          DATABASE_NAME="$DB_NAME" \
            pnpm exec drizzle-kit migrate --config=src/config/drizzle.config.ts

      - name: Deploy to kubernetes (Development)
        run: |
          # Pin the backend image to the immutable sha tag we just pushed, then
          # apply the development overlay (backend app base + vendored zero-sync
          # base, in the application-boilerplate namespace). The image change in
          # the pod template triggers a rollout on its own — no restart needed.
          cd ${{ env.CWD }}/deployment/kubernetes/overlays/development
          kustomize edit set image "$AWS_ECR_REGISTRY/$AWS_ECR_REPOSITORY=$AWS_ECR_REGISTRY/$AWS_ECR_REPOSITORY:$IMAGE_TAG"
          kubectl apply -k .

          kubectl rollout status deployment/application-boilerplatedotkonkerdotdev -n ${{ env.K8S_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/zero-sync -n ${{ env.K8S_NAMESPACE }} --timeout=5m
