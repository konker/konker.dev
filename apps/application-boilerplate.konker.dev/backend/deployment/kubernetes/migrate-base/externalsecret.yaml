# Superuser DB connection for the migration Job. Migrations run DDL (create the
# `widgets` table) and create the Zero publication, which the app user lacks
# privileges for — so this uses the superuser connection-info (same role as
# zero-sync). Reaches RDS via the in-cluster ssh-tunnel-proxy.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: migrate-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: migrate-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: '{{ printf "postgres://%s:%s@ssh-tunnel-proxy.infrastructure-development.svc.cluster.local:54321/%s?sslmode=require" .username .password .dbname }}'
  dataFrom:
    - extract:
        key: /secrets/development/application-boilerplate/database/superuser/connection-info
