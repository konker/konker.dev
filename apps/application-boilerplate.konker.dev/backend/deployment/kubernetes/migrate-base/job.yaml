# One-shot drizzle migration Job. Run before the app/zero-sync roll out (the CD
# workflow delete-then-applies it each deploy so the immutable pod template picks
# up the current SHA image, then waits for completion). Idempotent: drizzle
# tracks applied migrations in `__drizzle_migrations`.
#
# Uses the backend image (same string as base/deployment.yaml so the overlay
# `images:` transformer rewrites it to the SHA tag) and overrides the command to
# the migration runner. Creates the `widgets` table + the
# `application_boilerplate_zero_data` publication that zero-sync's db-check gates on.
apiVersion: batch/v1
kind: Job
metadata:
  name: application-boilerplate-migrate
  labels:
    app.kubernetes.io/name: application-boilerplate-migrate
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: application-boilerplate-migrate
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      # Required by CFKE: node auto-provisioning relies on requests + this selector.
      nodeSelector:
        cfke.io/provider: hetzner
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: migrate
          image: 047719649582.dkr.ecr.eu-west-1.amazonaws.com/application-boilerplate.konker.dev:latest
          command: ['node', 'dist/database/migrate.js']
          envFrom:
            - secretRef:
                name: migrate-db-credentials
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
