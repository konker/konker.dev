apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Database migration base. Not deployable standalone — consumed by overlays/<env>
# which set the namespace and the SHA-tagged backend image. The CD workflow runs
# the Job (delete-then-apply + wait) before rolling out the app and zero-sync.
resources:
  - externalsecret.yaml
  - job.yaml
