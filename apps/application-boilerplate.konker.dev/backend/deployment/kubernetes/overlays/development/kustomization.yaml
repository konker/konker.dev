apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Development overlay: backend app base + vendored zero-sync base, all in the
# application-boilerplate namespace. Apply with `kubectl apply -k .` from here.
namespace: application-boilerplate

resources:
  - ../../base
  - ../../zero-sync-base

patches:
  - path: zero-sync-patches.yaml
