apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Development overlay: backend app base + vendored zero-sync base, all in the
# application-boilerplate namespace. Apply with `kubectl apply -k .` from here.
namespace: application-boilerplate

resources:
  - ../../base
  - ../../zero-sync-base

patches:
  - path: zero-sync-patches.yaml

# Backend image tag. The ECR repo is IMMUTABLE, so deploys reference a unique
# commit-sha tag rather than :latest. CI overrides newTag per run via
# `kustomize edit set image` before applying; `latest` is only the local/manual
# default.
images:
  - name: 047719649582.dkr.ecr.eu-west-1.amazonaws.com/application-boilerplate.konker.dev
    newTag: latest
