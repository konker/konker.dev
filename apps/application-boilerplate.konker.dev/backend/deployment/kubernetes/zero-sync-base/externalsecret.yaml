apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zero-sync-secrets
  labels:
    app.kubernetes.io/name: zero-sync
    app.kubernetes.io/component: sync
    app.kubernetes.io/managed-by: kustomize
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: zero-sync-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ZERO_UPSTREAM_DB: '{{ printf "postgres://%s:%s@ssh-tunnel-proxy.infrastructure-REPLACE_ENVIRONMENT.svc.cluster.local:54321/%s?sslmode=require" .username .password .dbname }}'
        ZERO_CVR_DB: '{{ printf "postgres://%s:%s@ssh-tunnel-proxy.infrastructure-REPLACE_ENVIRONMENT.svc.cluster.local:54321/%s?sslmode=require" .username .password .dbname }}'
        ZERO_CHANGE_DB: '{{ printf "postgres://%s:%s@ssh-tunnel-proxy.infrastructure-REPLACE_ENVIRONMENT.svc.cluster.local:54321/%s?sslmode=require" .username .password .dbname }}'
        ZERO_ADMIN_PASSWORD: '{{ .admin_password }}'
        ZERO_QUERY_API_KEY: '{{ .backend_service_token }}'
        ZERO_MUTATE_API_KEY: '{{ .backend_service_token }}'
        ZERO_BACKEND_SERVICE_TOKEN: '{{ .backend_service_token }}'
        # Shared HS256 secret used to verify the client's JWT on the WS
        # connection (same value the backend verifies with as JWT_SIGNING_SECRET).
        # Without it zero-cache treats the connection as anonymous and forwards
        # no user context to /zero/mutate, so login-gated mutators reject.
        ZERO_AUTH_SECRET: '{{ .jwt_signing_secret }}'
        AWS_ACCESS_KEY_ID: '{{ .backup_access_key_id }}'
        AWS_SECRET_ACCESS_KEY: '{{ .backup_secret_access_key }}'
  dataFrom:
    - extract:
        key: /secrets/REPLACE_ENVIRONMENT/REPLACE_APP_KEY/database/superuser/connection-info
  data:
    - secretKey: admin_password
      remoteRef:
        key: /secrets/REPLACE_ENVIRONMENT/REPLACE_APP_KEY/zero-sync/admin-password
    - secretKey: backend_service_token
      remoteRef:
        key: /secrets/REPLACE_ENVIRONMENT/REPLACE_APP_KEY/zero-sync/backend-service-token
    - secretKey: jwt_signing_secret
      remoteRef:
        key: /secrets/REPLACE_ENVIRONMENT/REPLACE_APP_KEY/auth/jwt-signing-secret
    - secretKey: backup_access_key_id
      remoteRef:
        key: /secrets/REPLACE_ENVIRONMENT/shared/zero-sync-backups/access-key-id
    - secretKey: backup_secret_access_key
      remoteRef:
        key: /secrets/REPLACE_ENVIRONMENT/shared/zero-sync-backups/secret-access-key
