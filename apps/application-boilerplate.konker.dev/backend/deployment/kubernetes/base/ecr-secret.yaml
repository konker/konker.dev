# Image-pull credential for the private ECR backend image. CFKE/Hetzner nodes
# have no AWS instance role and ECR tokens expire ~12h, so ESO mints a fresh
# dockerconfigjson into `ecr-secret` (referenced by the Deployment's
# imagePullSecrets).
#
# A cluster-scoped ClusterGenerator can't be used here: ESO ignores a
# cross-namespace auth secretRef for the ECR generator (issue #3289, wontfix), so
# the credential must live in this namespace. We use a dedicated, least-privilege
# ECR-pull-only IAM user (deployment-infra/ecr-pull-user) — its keys are synced
# from SSM into `aws-ecr-credentials` and can ONLY pull ECR.

# 1. Sync the dedicated ECR-pull user's AWS keys from SSM into this namespace.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-ecr-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: aws-ecr-credentials
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: /secrets/development/infra/ecr-pull-user/access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: /secrets/development/infra/ecr-pull-user/access-key-secret
---
# 2. Namespaced ECR auth-token generator, authed by the local credentials above.
apiVersion: generators.external-secrets.io/v1alpha1
kind: ECRAuthorizationToken
metadata:
  name: ecr-auth-token
spec:
  region: eu-west-1
  auth:
    secretRef:
      accessKeyIDSecretRef:
        name: aws-ecr-credentials
        key: access-key-id
      secretAccessKeySecretRef:
        name: aws-ecr-credentials
        key: secret-access-key
---
# 3. Mint the dockerconfigjson `ecr-secret` from the generator's token.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ecr-secret
spec:
  refreshInterval: 10h # ECR tokens are valid ~12h; refresh ahead of expiry
  target:
    name: ecr-secret
    creationPolicy: Owner
    template:
      engineVersion: v2 # required for the printf/b64enc sprig functions below
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"047719649582.dkr.ecr.eu-west-1.amazonaws.com":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ECRAuthorizationToken
          name: ecr-auth-token
