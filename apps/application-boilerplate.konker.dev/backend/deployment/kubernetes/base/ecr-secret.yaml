# Image-pull secret for the private ECR backend image. CFKE/Hetzner nodes have
# no AWS instance role, so the kubelet needs explicit registry credentials, and
# ECR tokens expire every ~12h. ESO mints a fresh dockerconfigjson via the
# cluster-scoped `ecr-auth-token` ClusterGenerator (defined in cloudfleet-cluster
# / helm-external-secrets) and writes it to the `ecr-secret` referenced by the
# Deployment's imagePullSecrets.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ecr-secret
spec:
  refreshInterval: 10h # ECR tokens are valid ~12h; refresh ahead of expiry
  target:
    name: ecr-secret
    creationPolicy: Owner
    template:
      engineVersion: v2 # required for the printf/b64enc sprig functions below
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"047719649582.dkr.ecr.eu-west-1.amazonaws.com":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: ecr-auth-token
