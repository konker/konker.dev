apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-boilerplatedotkonkerdotdev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: application-boilerplatedotkonkerdotdev
  template:
    metadata:
      labels:
        app: application-boilerplatedotkonkerdotdev
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: application-boilerplatedotkonkerdotdev
          image: 047719649582.dkr.ecr.eu-west-1.amazonaws.com/application-boilerplate.konker.dev:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: application-boilerplate-config
            - secretRef:
                name: application-boilerplate-secrets
          livenessProbe:
            httpGet:
              path: /ping
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
