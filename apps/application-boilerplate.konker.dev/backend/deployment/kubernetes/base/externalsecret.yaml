apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: application-boilerplate-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: application-boilerplate-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_USER: '{{ .username }}'
        DATABASE_PASSWORD: '{{ .password }}'
        # Backend /zero/* routes connect to upstream as the app user via the tunnel proxy.
        ZERO_UPSTREAM_DB: '{{ printf "postgres://%s:%s@ssh-tunnel-proxy.infrastructure-development.svc.cluster.local:54321/%s?sslmode=require" .username .password .dbname }}'
        JWT_SIGNING_SECRET: '{{ .jwt_signing_secret }}'
        ZERO_BACKEND_SERVICE_TOKEN: '{{ .backend_service_token }}'
  dataFrom:
    - extract:
        key: /secrets/development/application-boilerplate/database/user/connection-info
  data:
    - secretKey: jwt_signing_secret
      remoteRef:
        key: /secrets/development/application-boilerplate/auth/jwt-signing-secret
    - secretKey: backend_service_token
      remoteRef:
        key: /secrets/development/application-boilerplate/zero-sync/backend-service-token
